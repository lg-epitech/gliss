# cargo-about configuration for licenses/rust-dependencies.md, the license texts
# of every Rust crate statically linked into the released gliss-server binary.
# Order sets preference when a crate offers a choice of licenses.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
