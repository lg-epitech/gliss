<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gliss desktop</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#e8edf2;color:#203345}*{box-sizing:border-box}body{margin:0}header{padding:12px 20px;background:#314b62;color:#fff;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header strong{font-size:20px;letter-spacing:-.7px}header span{font-size:13px}nav{display:flex;gap:8px;margin-left:auto}button,input,textarea{font:inherit}button{padding:7px 12px;background:#f4f7fa;color:#203345;border:1px solid #adbbc8;border-radius:5px;cursor:pointer}button:hover{background:#dbe7f1}button:focus-visible,input:focus-visible,canvas:focus-visible,textarea:focus-visible{outline:3px solid #508abe;outline-offset:3px}main{padding:20px;max-width:1800px;margin:auto}#login{max-width:400px;margin:80px auto;background:#fff;padding:28px;border-radius:8px;border:1px solid #c9d3dc}h1{font-size:22px;margin:0 0 10px}p{line-height:1.5}label{display:block;margin:22px 0 8px}input{width:100%;padding:10px;border:1px solid #adbbc8;border-radius:4px;margin-bottom:12px;background:#fff;color:#203345}#desktop{display:none}#viewport{overflow:auto;background:#142534;display:flex;align-items:flex-start;justify-content:center;border:1px solid #8ca0b1;min-height:120px;border-radius:5px}canvas{max-width:100%;height:auto;display:block;touch-action:none}#status{min-height:20px}footer{font-size:12px;color:#52677b;display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-variant-numeric:tabular-nums}dialog{max-width:600px;width:calc(100% - 40px);border:1px solid #8ca0b1;border-radius:8px;padding:24px;background:#f4f7fa;color:#203345}dialog::backdrop{background:#14253499}textarea{width:100%;height:200px;margin:12px 0;background:#fff;color:#203345;border:1px solid #adbbc8;padding:12px}#error{color:#a02424;font-size:14px}#hint{font-size:13px;color:#52677b}@media(prefers-color-scheme:dark){:root{background:#1f2d3a;color:#e7eff5}#login,dialog{background:#2b3c4b;color:#e7eff5;border-color:#536879}footer,#hint{color:#a9bccd}}
</style></head>
<body><header><strong>gliss</strong><span id="status">Desktop disconnected</span><nav><button id="sound" aria-pressed="false" disabled hidden>Sound off</button><button id="clipboard" hidden>Clipboard</button><button id="fit" hidden>Fit desktop</button><button id="fullscreen" hidden>Full screen</button><button id="disconnect" hidden>Disconnect</button></nav></header>
<main><form id="login"><h1>Open your desktop</h1><p>Enter the access key for this display.</p><label for="token">Access key</label><input id="token" type="password" autocomplete="off" required minlength="24"><button type="submit">Connect</button><p id="error" role="alert"></p></form>
<section id="desktop"><div id="viewport"><canvas id="screen" tabindex="0" aria-label="Remote desktop. Click to focus keyboard input."></canvas></div><footer><span id="resolution"></span><span id="rate"></span><span id="decode"></span><span id="traffic"></span></footer><p id="hint">Click the desktop to use the keyboard. Clipboard and guest resizing depend on the VM’s display support.</p></section></main>
<dialog id="clipdialog"><form method="dialog"><h1>Clipboard</h1><p>Copy received text or send text to the VM.</p><textarea id="cliptext" aria-label="Clipboard text" maxlength="1048576"></textarea><button type="button" id="sendclip">Send to VM</button> <button>Close</button></form></dialog>
<script type="module" src="/viewer.js"></script></body></html>
