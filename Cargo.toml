[workspace]
members = ["crates/gliss-core", "crates/gliss-rfb", "crates/gliss-codec", "crates/gliss-video", "crates/gliss-server", "crates/gliss-dbus", "crates/gliss-hybrid", "crates/gliss-hybrid-grid", "crates/gliss-hybrid-continuity", "crates/gliss-tiles"]
resolver = "2"
exclude = ["test-support/rust/adaptive-tiles", "test-support/rust/independent-tiles"]

[workspace.package]
version = "0.1.0-alpha.6"
rust-version = "1.98"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
gliss-core = { path = "crates/gliss-core" }
gliss-rfb = { path = "crates/gliss-rfb" }
gliss-codec = { path = "crates/gliss-codec" }
gliss-video = { path = "crates/gliss-video" }
gliss-dbus = { path = "crates/gliss-dbus" }
gliss-hybrid = { path = "crates/gliss-hybrid" }
gliss-hybrid-grid = { path = "crates/gliss-hybrid-grid" }

[profile.release]
lto = "thin"
codegen-units = 1
