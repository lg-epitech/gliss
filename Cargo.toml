[workspace]
members = ["crates/gliss-core", "crates/gliss-rfb", "crates/gliss-video", "crates/gliss-server"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.2"
rust-version = "1.98"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
gliss-core = { path = "crates/gliss-core" }
gliss-rfb = { path = "crates/gliss-rfb" }
gliss-video = { path = "crates/gliss-video" }

[profile.release]
lto = "thin"
codegen-units = 1
